name: proxodnaya-ci
on:
  pull_request:
    paths: ['proxodnaya/**', '.github/**']
  push:
    branches: [main]
    paths: ['proxodnaya/**', '.github/**']
concurrency:
  group: proxodnaya-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      infra: ${{ steps.f.outputs.infra }}
      has_backend: ${{ steps.e.outputs.backend }}
      has_frontend: ${{ steps.e.outputs.frontend }}
      has_infra: ${{ steps.e.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - id: e
        name: какие части уже существуют (до старта хакатона кода нет)
        run: |
          echo "backend=$([ -f proxodnaya/backend/pom.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f proxodnaya/frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "infra=$([ -f proxodnaya/infra/docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend: ['proxodnaya/backend/**', 'proxodnaya/contracts/**']
            frontend: ['proxodnaya/frontend/**', 'proxodnaya/contracts/**']
            infra: ['proxodnaya/infra/**']

  backend:
    needs: changes
    if: needs.changes.outputs.has_backend == 'true' && (needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B verify
        working-directory: proxodnaya/backend

  contract:
    needs: changes
    if: needs.changes.outputs.has_backend == 'true' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B -DskipTests verify -Pcontract
        working-directory: proxodnaya/backend
      - run: git diff --exit-code -- proxodnaya/contracts/openapi.json

  frontend:
    needs: changes
    if: needs.changes.outputs.has_frontend == 'true' && (needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: proxodnaya/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm, cache-dependency-path: proxodnaya/frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (вся история)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact -v
      - name: guard (красные линии)
        run: proxodnaya/scripts/guard.sh
      - name: trivy (уязвимости зависимостей)
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo/proxodnaya

  infra:
    needs: changes
    if: needs.changes.outputs.has_infra == 'true' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config -q
        working-directory: proxodnaya/infra

  smoke:
    needs: [changes, backend, frontend, security]
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.has_infra == 'true' && needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.security.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose up -d --build --wait
        working-directory: proxodnaya/infra
      - run: proxodnaya/scripts/smoke.sh https://localhost
      - if: failure()
        run: docker compose logs --tail=200
        working-directory: proxodnaya/infra
