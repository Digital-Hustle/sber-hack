name: proxodnaya-ci
on:
  pull_request:
    paths: ['proxodnaya/**', '.github/**']
  push:
    branches: [main]
    paths: ['proxodnaya/**', '.github/**']
concurrency:
  group: proxodnaya-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.svc.outputs.list }}
      has_services: ${{ steps.svc.outputs.has }}
      frontend: ${{ steps.f.outputs.frontend }}
      infra: ${{ steps.f.outputs.infra }}
      has_frontend: ${{ steps.e.outputs.frontend }}
      has_infra: ${{ steps.e.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: e
        name: какие части уже существуют (до старта хакатона кода нет)
        run: |
          echo "frontend=$([ -f proxodnaya/frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "infra=$([ -f proxodnaya/infra/docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend: ['proxodnaya/frontend/**', 'proxodnaya/contracts/**']
            infra: ['proxodnaya/infra/**']
      - id: svc
        name: изменённые сервисы (libs/common или parent pom → все)
        run: |
          cd proxodnaya
          all=$(ls -d services/*/ 2>/dev/null | xargs -rn1 basename | grep -v '^libs$' || true)
          if [ -z "$all" ] || [ ! -f services/pom.xml ]; then echo 'list=[]' >> "$GITHUB_OUTPUT"; echo has=false >> "$GITHUB_OUTPUT"; exit 0; fi
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          changed=$(git diff --relative --name-only "$base" HEAD 2>/dev/null || echo services/pom.xml)
          if [ "${{ github.ref }}" = refs/heads/main ] || grep -qE '^services/(libs/|pom.xml)' <<<"$changed"; then list="$all"
          else list=$(grep -oE '^services/[a-z-]+/' <<<"$changed" | cut -d/ -f2 | grep -v '^libs$' | sort -u || true); fi
          json=$(printf '%s\n' $list | jq -R . | jq -sc 'map(select(length>0))')
          echo "list=$json" >> "$GITHUB_OUTPUT"
          if [ "$json" = "[]" ]; then echo has=false >> "$GITHUB_OUTPUT"; else echo has=true >> "$GITHUB_OUTPUT"; fi

  services:
    needs: changes
    if: needs.changes.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: build + test
        run: ./mvnw -B -pl ${{ matrix.svc }} -am verify
        working-directory: proxodnaya/services
      - name: contract
        run: |
          ./mvnw -B -q -pl ${{ matrix.svc }} -am -DskipTests verify -Pcontract
          git diff --exit-code -- ../contracts/
        working-directory: proxodnaya/services

  frontend:
    needs: changes
    if: needs.changes.outputs.has_frontend == 'true' && (needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: proxodnaya/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm, cache-dependency-path: proxodnaya/frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (вся история)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact -v
      - name: guard (красные линии)
        run: proxodnaya/scripts/guard.sh
      - name: trivy (уязвимости зависимостей)
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo/proxodnaya

  infra:
    needs: changes
    if: needs.changes.outputs.has_infra == 'true' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config -q
        working-directory: proxodnaya/infra

  smoke:
    needs: [changes, services, frontend, security]
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.has_infra == 'true' && (needs.services.result == 'success' || needs.services.result == 'skipped') && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') && needs.security.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose up -d --build --wait --wait-timeout 600
        working-directory: proxodnaya/infra
      - run: proxodnaya/scripts/smoke.sh https://localhost
      - if: failure()
        run: docker compose logs --tail=200
        working-directory: proxodnaya/infra
