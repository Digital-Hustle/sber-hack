name: documents-deploy
# Включение: переменная репозитория DOCS_DEPLOY_ENABLED=true + секреты DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
# Образы собираются теми же Dockerfile, что и в compose (сборка внутри образа, ADR-014), и пушатся в GHCR.
on:
  workflow_run:
    workflows: [documents-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref: { description: 'git ref / тег (например docs-demo-2)', required: true, default: main }
permissions:
  contents: read
  packages: write
concurrency: { group: documents-deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: vars.DOCS_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REF: ${{ inputs.ref || github.event.workflow_run.head_sha }}
      SERVICES: gateway intake ocr docproc review caddy
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.REF }}' }
      - id: v
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/documents" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: build & push (gateway, intake, ocr, docproc, review, caddy+frontend)
        working-directory: documents/infra
        env:
          IMAGE_REGISTRY: ${{ steps.v.outputs.registry }}
          IMAGE_TAG: ${{ steps.v.outputs.tag }}
        run: |
          ../scripts/gen-env.sh   # только для интерполяции compose при сборке; секреты стенда живут на сервере
          docker compose build $SERVICES
          docker compose push $SERVICES
      - name: deploy over ssh (health-check, откат на прошлый тег)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ steps.v.outputs.tag }}
          IMAGE_REGISTRY: ${{ steps.v.outputs.registry }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" "
            set -e; cd /opt/sber-hack && git fetch -q origin && git checkout -q $REF; cd documents/infra
            sed -i '/^IMAGE_REGISTRY=/d' .env && echo 'IMAGE_REGISTRY=$IMAGE_REGISTRY' >> .env
            grep -q '^IMAGE_TAG=' .env || echo 'IMAGE_TAG=latest' >> .env
            PREV=\$(grep '^IMAGE_TAG=' .env | cut -d= -f2)
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env
            docker compose pull $SERVICES && docker compose up -d --no-build --remove-orphans
            for i in \$(seq 1 45); do ../scripts/smoke.sh https://localhost >/dev/null 2>&1 && exit 0; sleep 4; done
            echo 'smoke failed, rollback to' \$PREV; sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=\$PREV/\" .env
            docker compose up -d --no-build; exit 1"
          rm -f key
