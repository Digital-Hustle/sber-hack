# Стенд «Субсидии» (docs/DEPLOY.md). Запуск: ../scripts/gen-env.sh && docker compose up -d --wait
# Локальная модель: docker compose --profile llm-local up -d
# Сервисы приложения (package, docproc, ocr, rules, assistant, gateway) добавляются своими PR.
name: subsidy

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      PACKAGE_DB_PASSWORD: ${PACKAGE_DB_PASSWORD:?}
      DOCPROC_DB_PASSWORD: ${DOCPROC_DB_PASSWORD:?}
      RULES_DB_PASSWORD: ${RULES_DB_PASSWORD:?}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  kafka:
    <<: *restart
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      retries: 20

  kafka-topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/topics.sh"]
    volumes:
      - ./kafka/topics.sh:/topics.sh:ro
    restart: "no"

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.4
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_HOSTNAME: "https://${KC_HOSTNAME:?}/auth"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      KC_SVC_PACKAGE_SECRET: ${KC_SVC_PACKAGE_SECRET:?}
      KC_SVC_DOCPROC_SECRET: ${KC_SVC_DOCPROC_SECRET:?}
      KC_SVC_RULES_SECRET: ${KC_SVC_RULES_SECRET:?}
      KC_SVC_ASSISTANT_SECRET: ${KC_SVC_ASSISTANT_SECRET:?}
      KC_DEMO_SPECIALIST_PASSWORD: ${KC_DEMO_SPECIALIST_PASSWORD:?}
      KC_DEMO_SENIOR_PASSWORD: ${KC_DEMO_SENIOR_PASSWORD:?}
      KC_DEMO_AUDITOR_PASSWORD: ${KC_DEMO_AUDITOR_PASSWORD:?}
      PUBLIC_HOST: ${PUBLIC_HOST:?}
    volumes:
      - ./keycloak/subsidy-realm.json:/opt/keycloak/data/import/subsidy-realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30

  jaeger:
    <<: *restart
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  ollama:
    <<: *restart
    profiles: [llm-local]
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  ollama-pull:
    profiles: [llm-local]
    image: ollama/ollama:0.12.6
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen3:8b} && ollama pull ${LLM_VISION_MODEL:-qwen2.5vl:7b}"]
    restart: "no"

  caddy:
    <<: *restart
    build:
      context: ../frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      keycloak: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      retries: 10

volumes:
  pgdata:
  kafkadata:
  ollama:
  caddydata:
