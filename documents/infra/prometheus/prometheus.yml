# Наблюдаемость (NFR-07): метрики сервисов внутри сети compose. Профиль observability, UI — только localhost:9090.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080', 'intake:8081', 'docproc:8082', 'review:8083']
  - job_name: ocr
    metrics_path: /metrics
    static_configs:
      - targets: ['ocr:8000']
