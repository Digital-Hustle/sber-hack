[project]
name = "documents-eval"
version = "0.1.0"
description = "Оценка качества разбора документов: синтетика, метрики, прогон через публичный API"
requires-python = ">=3.11"
dependencies = ["pillow>=10.4"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
