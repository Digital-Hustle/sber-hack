# Стенд «Проходной»: docker compose up -d (из proxodnaya/infra, рядом .env от scripts/gen-env.sh).
# Наружу — только Caddy (80/443). Сервисы, Kafka, Postgres, Keycloak — во внутренней сети без проброса портов.
# Образы — GHCR (CD), локально: jar-ы Gradle (`./gradlew bootJar`) + `docker compose build`.
name: proxodnaya

x-java: &java
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
  mem_limit: 512m
  environment: &java-env
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError
    DB_HOST: postgres
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-prod}
    # iss в токенах — публичный адрес Keycloak; ключи и токены сервисы берут напрямую из внутренней сети
    OIDC_ISSUER_URI: https://${PUBLIC_HOST}/auth/realms/proxodnaya
    OIDC_JWKS_URI: http://keycloak:8080/auth/realms/proxodnaya/protocol/openid-connect/certs
    OIDC_TOKEN_URI: http://keycloak:8080/auth/realms/proxodnaya/protocol/openid-connect/token
    OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    SITE_ZONE: ${SITE_ZONE:-Europe/Moscow}
    PRESENCE_TTL: ${PRESENCE_TTL:-16h}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [ gateway, keycloak ]
    mem_limit: 100m

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD}
      ACCESS_DB_PASSWORD: ${ACCESS_DB_PASSWORD}
      SHIFT_DB_PASSWORD: ${SHIFT_DB_PASSWORD}
      FACE_DB_PASSWORD: ${FACE_DB_PASSWORD}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # топики создаются при первой публикации (один брокер, контракт событий — contracts/events)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 1g

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command: [ "start", "--import-realm" ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://${PUBLIC_HOST}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70
      # плейсхолдеры realm-proxodnaya.json
      PUBLIC_HOST: ${PUBLIC_HOST}
      KC_SVC_PEOPLE_SECRET: ${KC_SVC_PEOPLE_SECRET}
      KC_SVC_ACCESS_SECRET: ${KC_SVC_ACCESS_SECRET}
      KC_SVC_SHIFT_SECRET: ${KC_SVC_SHIFT_SECRET}
      KC_SVC_ASSISTANT_SECRET: ${KC_SVC_ASSISTANT_SECRET}
      KC_PROVISIONER_SECRET: ${KC_PROVISIONER_SECRET}
      KC_DEMO_ADMIN_PASSWORD: ${KC_DEMO_ADMIN_PASSWORD}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    mem_limit: 256m

  gateway:
    image: ghcr.io/digital-hustle/gate-gateway:${IMAGE_TAG:-latest}
    build: { context: ../services, args: { SERVICE: gateway } }
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *java-env
      PEOPLE_URL: http://people:8081
      ACCESS_URL: http://access:8082
      SHIFT_URL: http://shift:8083
      ASSISTANT_URL: http://assistant:8084
      CORS_ORIGINS: https://${PUBLIC_HOST}
      MAX_BODY: ${MAX_BODY:-5MB}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-20}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-30s}

  people:
    <<: *java
    image: ghcr.io/digital-hustle/gate-people:${IMAGE_TAG:-latest}
    build: { context: ../services, args: { SERVICE: people } }
    environment:
      <<: *java-env
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD}
      KC_SVC_PEOPLE_SECRET: ${KC_SVC_PEOPLE_SECRET}
      FACE_URL: http://face:8090
      FACE_TIMEOUT: ${FACE_TIMEOUT:-5s}
      INVITE_PEPPER: ${INVITE_PEPPER}
      INVITE_TTL: ${INVITE_TTL:-72h}
      PUBLIC_URL: https://${PUBLIC_HOST}

  access:
    <<: *java
    image: ghcr.io/digital-hustle/gate-access:${IMAGE_TAG:-latest}
    build: { context: ../services, args: { SERVICE: access } }
    environment:
      <<: *java-env
      ACCESS_DB_PASSWORD: ${ACCESS_DB_PASSWORD}
      KC_SVC_ACCESS_SECRET: ${KC_SVC_ACCESS_SECRET}
      FACE_URL: http://face:8090
      PEOPLE_URL: http://people:8081
      SHIFT_URL: http://shift:8083
      DEPS_TIMEOUT: ${DEPS_TIMEOUT:-1500ms}
      QR_WINDOW_TOLERANCE: ${QR_WINDOW_TOLERANCE:-90s}
      REPEAT_SCAN_COOLDOWN: ${REPEAT_SCAN_COOLDOWN:-30s}
      CHALLENGE_TTL: ${CHALLENGE_TTL:-10s}

  shift:
    <<: *java
    image: ghcr.io/digital-hustle/gate-shift:${IMAGE_TAG:-latest}
    build: { context: ../services, args: { SERVICE: shift } }
    environment:
      <<: *java-env
      SHIFT_DB_PASSWORD: ${SHIFT_DB_PASSWORD}
      KC_SVC_SHIFT_SECRET: ${KC_SVC_SHIFT_SECRET}
      SHIFT_EARLY_ENTRY: ${SHIFT_EARLY_ENTRY:-60m}
      AUTO_CLOSE_AFTER: ${AUTO_CLOSE_AFTER:-2h}
      LATE_GRACE: ${LATE_GRACE:-5m}
      OVERTIME_THRESHOLD: ${OVERTIME_THRESHOLD:-15m}
      SITE_LAT: ${SITE_LAT:-}
      SITE_LON: ${SITE_LON:-}
      SITE_RADIUS_M: ${SITE_RADIUS_M:-300}
      NO_SIGNAL_AFTER: ${NO_SIGNAL_AFTER:-5m}
      CROWD_LIMIT: ${CROWD_LIMIT:-0}
      CROWD_FOR: ${CROWD_FOR:-5m}

  face:
    image: ghcr.io/digital-hustle/gate-face:${IMAGE_TAG:-latest}
    build: { context: ../services/face }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 768m
    environment:
      DB_HOST: postgres
      FACE_DB_PASSWORD: ${FACE_DB_PASSWORD}
      BIOMETRY_KEY: ${BIOMETRY_KEY}
      OIDC_ISSUER_URI: https://${PUBLIC_HOST}/auth/realms/proxodnaya
      OIDC_JWKS_URI: http://keycloak:8080/auth/realms/proxodnaya/protocol/openid-connect/certs
      FACE_AUDIENCE: face
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.363}
      FACE_CONSISTENCY_THRESHOLD: ${FACE_CONSISTENCY_THRESHOLD:-0.30}
      FACE_MIN_SIZE: ${FACE_MIN_SIZE:-80}
      FACE_YAW_MIN: ${FACE_YAW_MIN:-0.12}
      FACE_PITCH_DELTA: ${FACE_PITCH_DELTA:-0.12}
      FACE_MIRRORED: ${FACE_MIRRORED:-false}

  # Сервис пока пустой — включается профилем, когда появится код
  assistant:
    <<: *java
    profiles: [ assistant ]
    image: ghcr.io/digital-hustle/gate-assistant:${IMAGE_TAG:-latest}
    build: { context: ../services, args: { SERVICE: assistant } }
    environment:
      <<: *java-env
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD}
      KC_SVC_ASSISTANT_SECRET: ${KC_SVC_ASSISTANT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}

  # SPA (образ собирает CD из frontend/); без него Caddy отдаёт 502 на страницы, API работает
  frontend:
    profiles: [ frontend ]
    image: ghcr.io/digital-hustle/gate-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 100m

  ollama:
    profiles: [ llm-local ]
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: 4g

volumes:
  pg-data:
  kafka-data:
  caddy-data:
  caddy-config:
  ollama-data:
