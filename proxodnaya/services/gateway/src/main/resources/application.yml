spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: ${UPSTREAM_TIMEOUT:30s}
          default-filters:
            # лимит тела: кадры киоска (3 × JPEG) и снимки эталона
            - name: RequestSize
              args:
                maxSize: ${MAX_BODY:5MB}
            - RemoveRequestHeader=Cookie
          # /<svc>/api/v1/** → http://<svc>:<port>/api/v1/** ; /internal/** закрыт фильтром до маршрутов
          routes:
            - id: people
              uri: ${PEOPLE_URL:http://people:8081}
              predicates: [ "Path=/people/api/v1/**" ]
              filters: [ "RewritePath=/people/(?<path>.*), /$\\{path}" ]
            - id: access
              uri: ${ACCESS_URL:http://access:8082}
              predicates: [ "Path=/access/api/v1/**" ]
              filters: [ "RewritePath=/access/(?<path>.*), /$\\{path}" ]
            - id: shift-stream
              uri: ${SHIFT_URL:http://shift:8083}
              predicates: [ "Path=/shift/api/v1/stream/**" ]
              filters: [ "RewritePath=/shift/(?<path>.*), /$\\{path}" ]
              # SSE: без таймаута ответа
              metadata:
                response-timeout: -1
            - id: shift
              uri: ${SHIFT_URL:http://shift:8083}
              predicates: [ "Path=/shift/api/v1/**" ]
              filters: [ "RewritePath=/shift/(?<path>.*), /$\\{path}" ]
            - id: assistant
              uri: ${ASSISTANT_URL:http://assistant:8084}
              predicates: [ "Path=/assistant/api/v1/**" ]
              filters: [ "RewritePath=/assistant/(?<path>.*), /$\\{path}" ]
              # поток ответа LLM
              metadata:
                response-timeout: 180000

gateway:
  issuers:
    - issuer: ${OIDC_ISSUER_URI}
      jwk-set-uri: ${OIDC_JWKS_URI:${OIDC_ISSUER_URI}/protocol/openid-connect/certs}
  cors: ${CORS_ORIGINS:}
  rate-limit:
    paths: [ "/people/api/v1/auth/**", "/access/api/v1/kiosk/attempts/**", "/access/api/v1/kiosk/attempts" ]
    capacity: ${RATE_LIMIT_CAPACITY:20}
    window: ${RATE_LIMIT_WINDOW:1m}

server:
  port: 8080
  shutdown: graceful

management:
  server:
    port: 8079
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
