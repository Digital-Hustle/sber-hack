spring:
  application:
    name: assistant
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/assistant
    username: assistant
    password: ${ASSISTANT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: assistant
      auto-offset-reset: earliest
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: assistant

server:
  port: 8084
  shutdown: graceful

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs

assistant:
  # LLM за портом (ADR-005): ollama (локально, OpenAI-совместимый /v1) или openai (любой OpenAI-совместимый API)
  provider: ${LLM_PROVIDER:ollama}
  base-url: ${LLM_BASE_URL:http://ollama:11434}
  api-key: ${LLM_API_KEY}
  model: ${LLM_MODEL:qwen3:4b}
  timeout: ${LLM_TIMEOUT_SECONDS:30}s
  max-iterations: 3
  shift-url: ${SHIFT_URL:http://shift:8083}
  site-zone: ${SITE_ZONE:Europe/Moscow}

resilience4j:
  circuitbreaker:
    instances:
      llm:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

proxodnaya:
  security:
    # издатель токенов people: телефоны рабочих и персонал по коду из письма (ADR-040); ключи — из внутренней сети
    people-issuer: ${PEOPLE_TOKEN_ISSUER}
    people-jwks-uri: ${PEOPLE_JWKS_URI}
