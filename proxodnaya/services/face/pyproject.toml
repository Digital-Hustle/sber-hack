[project]
name = "face"
version = "0.1.0"
description = "Сверка лица 1:1 и живость для «Проходной» (YuNet + SFace, OpenCV)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    "cryptography>=43",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pyjwt[crypto]>=2.9,<3",
    "prometheus-client>=0.20,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["face", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["models: нужны ONNX-модели (скачиваются scripts/fetch_models.sh)", "db: нужен PostgreSQL (DB_HOST)"]
