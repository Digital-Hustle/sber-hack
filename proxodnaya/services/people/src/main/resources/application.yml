spring:
  application:
    name: people
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/people
    username: people
    password: ${PEOPLE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: people
      auto-offset-reset: earliest
      enable-auto-commit: false
  mail:
    # без SMTP_HOST письма не уходят (код — в лог только при STAFF_LOG_CODES=true, для локальной разработки)
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          # ключи — из внутренней сети (в compose: http://keycloak:8080/...), iss сверяется с issuer-uri
          jwk-set-uri: ${OIDC_JWKS_URI:${OIDC_ISSUER_URI}/protocol/openid-connect/certs}
          audiences: people
      # токен сервиса для /internal/face/** (client credentials, роль SVC_PEOPLE)
      client:
        registration:
          svc:
            provider: keycloak
            client-id: ${KC_SVC_PEOPLE_CLIENT_ID:svc-people}
            client-secret: ${KC_SVC_PEOPLE_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:${OIDC_ISSUER_URI}/protocol/openid-connect/token}

people:
  invite:
    ttl: ${INVITE_TTL:72h}
    pepper: ${INVITE_PEPPER}
    link-base: ${PUBLIC_URL}
  face:
    url: ${FACE_URL:http://face:8090}
    timeout: ${FACE_TIMEOUT:5s}
  tokens:
    # токены people (ADR-040): device-токен телефона, сессия персонала; ключ ES256 — scripts/gen-env.sh
    issuer: ${PEOPLE_TOKEN_ISSUER}
    signing-key: ${DEVICE_TOKEN_SIGNING_KEY}
    audiences: [people, access, shift, assistant]
    device-ttl: ${DEVICE_TOKEN_TTL:10m}
    challenge-ttl: 60s
  staff:
    # вход персонала по коду из письма (PPL-13, ADR-041)
    pepper: ${INVITE_PEPPER}
    code-ttl: 10m
    resend-after: 45s
    max-attempts: 5
    access-ttl: ${STAFF_ACCESS_TTL:10m}
    session-ttl: 12h
    login-url: ${PUBLIC_URL}/admin/login
    mail-from: ${SMTP_FROM:Проходная <no-reply@proxodnaya.local>}
    bootstrap-email: ${STAFF_BOOTSTRAP_ADMIN_EMAIL:}
    log-codes: ${STAFF_LOG_CODES:false}

server:
  port: 8081
  shutdown: graceful

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs

proxodnaya:
  security:
    # издатель токенов people: телефоны рабочих и персонал по коду из письма (ADR-040); ключи — из внутренней сети
    people-issuer: ${PEOPLE_TOKEN_ISSUER}
    people-jwks-uri: ${PEOPLE_JWKS_URI}
