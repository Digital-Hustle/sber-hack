spring:
  application:
    name: shift
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/shift
    username: shift
    password: ${SHIFT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: shift
      auto-offset-reset: earliest
      enable-auto-commit: false
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          # ключи — из внутренней сети (в compose: http://keycloak:8080/...), iss сверяется с issuer-uri
          jwk-set-uri: ${OIDC_JWKS_URI:${OIDC_ISSUER_URI}/protocol/openid-connect/certs}
          audiences: shift

shift:
  site-zone: ${SITE_ZONE:Europe/Moscow}
  early-entry: ${SHIFT_EARLY_ENTRY:60m}
  auto-close-after: ${AUTO_CLOSE_AFTER:2h}
  presence-ttl: ${PRESENCE_TTL:16h}

server:
  port: 8083
  shutdown: graceful

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
